<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="책갈피 — 읽는 시간을 기록하는 나만의 독서 서재" />
<meta name="theme-color" content="#f5faf3" />
<title>책갈피 · 독서기록</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./assets/icon.svg" />
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button class="topbar__brand" data-nav="#/home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="brand-mark"><path d="M6 3h9a3 3 0 0 1 3 3v15l-4.5-3L9 21V6a3 3 0 0 0-3-3z"/></svg>
      <span>책갈피</span>
    </button>
    <div class="topbar__search">
      <input id="globalSearch" type="search" placeholder="내 서재에서 검색  (/)" autocomplete="off" />
    </div>
    <div class="topbar__actions">
      <a id="btnSettings" class="btn btn--icon btn--soft" href="#/settings" data-route="settings" title="설정" aria-label="설정">⚙</a>
      <button id="btnTheme" class="btn btn--icon btn--soft" type="button" title="테마 전환 (T)" aria-label="테마 전환">◐</button>
      <button id="btnAddBook" class="btn btn--primary" type="button">
        <span class="i">＋</span><span class="lbl">책 추가</span>
      </button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="주요 화면">
    <a class="tb" href="#/home" data-route="home"><b>⌂</b><span>홈</span></a>
    <a class="tb" href="#/library" data-route="library"><b>▦</b><span>서재</span></a>
    <a class="tb" href="#/timeline" data-route="timeline"><b>◷</b><span>기록</span></a>
    <a class="tb tb--add" href="#/add" data-route="add" aria-label="책 추가"><b>＋</b></a>
    <a class="tb" href="#/notes" data-route="notes"><b>❞</b><span>문장</span></a>
    <a class="tb" href="#/stats" data-route="stats"><b>◫</b><span>통계</span></a>
  </nav>

  <div id="timerDock" class="timer-dock" hidden></div>
  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
</div>

<script type="module" src="./js/app.js"></script>

<!--
  앱이 뜨지 못하면 제목줄만 남고 아래가 백지가 된다. 그게 무슨 뜻인지 알 길이 없으므로,
  화면이 비어 있으면 이유와 할 일을 대신 띄운다. (모듈이라 문법 오류도 여기서만 잡힌다)
-->
<script>
(function () {
  var told = false;
  function tell(why) {
    if (told) return;
    var v = document.getElementById('view');
    if (!v || v.children.length) return;      // 이미 잘 그려졌으면 가만히 둔다
    told = true;
    v.innerHTML =
      '<div class="empty"><strong>화면을 불러오지 못했어요</strong>'
      + '<div style="margin:10px 0 16px;line-height:1.7">'
      + '새로고침하면 대개 해결됩니다. 그래도 그대로면 <b>Ctrl</b>(Mac 은 <b>⌘</b>)을 누른 채 새로고침해 주세요.<br>'
      + '<span style="opacity:.7">기록은 이 기기에 그대로 있습니다. 지워지지 않았어요.</span>'
      + '</div>'
      + '<button class="btn btn--primary" onclick="location.reload(true)">새로고침</button>'
      + (why ? '<div style="margin-top:14px;font-size:11px;opacity:.55">' + why + '</div>' : '')
      + '</div>';
  }
  addEventListener('error', function (e) { tell(e && e.message); }, true);
  addEventListener('unhandledrejection', function () { tell(); });
  setTimeout(function () { tell('시작이 너무 오래 걸렸습니다'); }, 8000);
})();
</script>
</body>
</html>
