<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="책갈피 — 읽는 시간을 기록하는 나만의 독서 서재" />
<meta name="theme-color" content="#1b1a17" />
<title>책갈피 · 독서기록</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./assets/icon.svg" />
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button class="topbar__brand" data-nav="#/home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="brand-mark"><path d="M6 3h9a3 3 0 0 1 3 3v15l-4.5-3L9 21V6a3 3 0 0 0-3-3z"/></svg>
      <span>책갈피</span>
    </button>
    <div class="topbar__search">
      <input id="globalSearch" type="search" placeholder="내 서재에서 검색  (/)" autocomplete="off" />
    </div>
    <div class="topbar__actions">
      <button id="btnAddBook" class="btn btn--primary" type="button">
        <span class="i">＋</span><span class="lbl">책 추가</span>
      </button>
      <button id="btnTheme" class="btn btn--icon" type="button" title="테마 전환 (T)">◐</button>
    </div>
  </header>

  <nav class="sidenav" id="sidenav">
    <a class="sidenav__item" href="#/home" data-route="home"><span class="ic">🏠</span><span>홈</span></a>
    <a class="sidenav__item" href="#/library" data-route="library"><span class="ic">📚</span><span>서재</span></a>
    <a class="sidenav__item" href="#/timeline" data-route="timeline"><span class="ic">🕘</span><span>기록</span></a>
    <a class="sidenav__item" href="#/notes" data-route="notes"><span class="ic">✍️</span><span>문장·실천</span></a>
    <a class="sidenav__item" href="#/stats" data-route="stats"><span class="ic">📈</span><span>통계</span></a>
    <a class="sidenav__item" href="#/settings" data-route="settings"><span class="ic">⚙️</span><span>설정</span></a>
  </nav>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar">
    <a class="tabbar__item" href="#/home" data-route="home"><span class="ic">🏠</span><span>홈</span></a>
    <a class="tabbar__item" href="#/library" data-route="library"><span class="ic">📚</span><span>서재</span></a>
    <a class="tabbar__item tabbar__add" href="#/add" data-route="add"><span class="ic">＋</span></a>
    <a class="tabbar__item" href="#/notes" data-route="notes"><span class="ic">✍️</span><span>문장</span></a>
    <a class="tabbar__item" href="#/stats" data-route="stats"><span class="ic">📈</span><span>통계</span></a>
  </nav>

  <div id="timerDock" class="timer-dock" hidden></div>
  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
